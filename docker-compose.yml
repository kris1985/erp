# 开发默认连本机 MySQL（与 chatbi local 一致：root/123456）。
# 仅打包运行 App 时使用；数据库请用本机实例。
services:
  app:
    build: .
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      USE_SQLITE: "false"
      DATABASE_URL: mysql+pymysql://root:123456@host.docker.internal:3306/workshop?charset=utf8mb4
      SECRET_KEY: change-me-in-prod
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      WECHAT_TOKEN: workshop_dev_token
      WEB_DIST_DIR: /app/web/dist
